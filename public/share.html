<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processando arquivo...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e4e4eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #1a1a26;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Processando arquivo compartilhado...</p>
  </div>

  <script>
    /**
     * Fallback Share Target handler.
     * 
     * When the Service Worker is active, it intercepts the POST to /share,
     * caches the file, and redirects to /?share-target. This page is never reached.
     * 
     * This page only loads when:
     * 1. The SW is not yet active (first install)
     * 2. The SW failed to intercept the request
     * 
     * In those cases, we redirect to the main app.
     */
    window.location.href = '/';
  </script>
</body>
</html>
